services:
  app:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: fossmec
    depends_on:
      - mongo

  mongo:
    image: mongo:7

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    ports:
      - "8080:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - mongo

